<!DOCTYPE html>
<!--
  ESQUELETO · ficha-tecnica
  ==========================================================================
  Se copia a publicado/AREA/NN.N-nombre.html y se rellena desde el .txt
  correspondiente. Cada bloque indica qué marcador lo alimenta.

  Reglas al rellenar:
    · Todo string literal (CVE, comando, ruta, puerto) va con <span class="lit">
    · Un bloque sin contenido real en el .txt se ELIMINA, no se deja vacío
    · El orden de los bloques no se altera
    · Ante cualquier duda, se consulta antes de improvisar
  ==========================================================================
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITULO</title>
<meta name="description" content="SUBTITULO">
<meta property="og:title" content="TITULO">
<meta property="og:description" content="SUBTITULO">
<meta property="og:type" content="website">
<link rel="stylesheet" href="../../estilo.css">
</head>
<body>
<main class="ficha">

  <!-- ===== encabezado · campos TITULO y SUBTITULO del .txt ===== -->
  <header class="cabecera">
    <div>
      <h1>TITULO</h1>
      <div class="subtitulo">SUBTITULO</div>
      <!-- si el .txt no trae SUBTITULO, se borra la línea de arriba -->
    </div>
    <div class="meta">
      NN.N · AREA
    </div>
  </header>

  <!-- ===== [BANDA CLAVE] ===== -->
  <section class="banda-clave">
    <div class="etiqueta">Si te acordás de una sola cosa</div>
    <div class="frase">
      <!-- una sola frase, la que reconstruye el resto del tema -->
    </div>
  </section>

  <!-- ===== [IDENTIDAD] · componente .pares ===== -->
  <!-- una fila por par "nombre | rol" del .txt                      -->
  <!-- .nombre.destacado y .nombre.incorrecto para marcar los que    -->
  <!-- el .txt señale; el resto va sin clase de color                -->
  <section class="bloque" aria-labelledby="bloque-identidad">
    <div class="bloque-cab"><h2 class="bloque-tit" id="bloque-identidad">Identidad</h2>
    </div>
    <div class="pares">
      <div class="nombre"></div><div class="rol"></div>
      <div class="nombre"></div><div class="rol"></div>
    </div>
  </section>

  <!-- ===== [MECANISMO] · .parrafo + .aparte + .tres-up ===== -->
  <!-- .tres-up es opcional: sólo si el .txt trae la lista con "-"   -->
  <section class="bloque" aria-labelledby="bloque-mecanismo">
    <div class="bloque-cab"><h2 class="bloque-tit" id="bloque-mecanismo">Mecanismo</h2>
    </div>
    <p class="parrafo"></p>
    <p class="aparte"></p>
    <div class="tres-up">
      <div class="celda"><b></b><span></span></div>
      <div class="celda"><b></b><span></span></div>
      <div class="celda"><b></b><span></span></div>
    </div>
  </section>

  <!-- ===== [SECUENCIA] · .cadena ===== -->
  <!-- máximo 5 pasos, con .flecha entre cada uno                    -->
  <!-- .paso.destacado y .paso.incorrecto según lo marque el .txt    -->
  <!-- .nota-loop sólo si la secuencia se repite                     -->
  <section class="bloque" aria-labelledby="bloque-secuencia">
    <div class="bloque-cab"><h2 class="bloque-tit" id="bloque-secuencia">Secuencia</h2>
    </div>
    <div class="cadena">
      <div class="paso"><b></b><span></span></div>
      <div class="flecha" aria-hidden="true">→</div>
      <div class="paso"><b></b><span></span></div>
    </div>
    <div class="nota-loop"></div>
    <p class="aparte"></p>
  </section>

  <!-- ===== [DATO ANCLA] · .ancla-num + .barra + .hitos ===== -->
  <!-- .barra y .hitos sólo si el .txt trae una línea de tiempo      -->
  <!-- .hitos espera exactamente 3 entradas                          -->
  <section class="bloque" aria-labelledby="bloque-dato-ancla">
    <div class="bloque-cab"><h2 class="bloque-tit" id="bloque-dato-ancla">Dato ancla</h2>
    </div>
    <div class="ancla-num"></div>
    <div class="ancla-sub"></div>
    <div class="barra"></div>
    <div class="hitos">
      <div class="hito"><b></b><span></span></div>
      <div class="hito"><b></b><span></span></div>
      <div class="hito"><b></b><span></span></div>
    </div>
  </section>

  <!-- ===== [QUE HAGO YO] · .dos-col ===== -->
  <!-- los títulos de columna los define el .txt: mitigar/detectar,  -->
  <!-- qué comando corro/qué reviso, etc. según el tema              -->
  <section class="bloque" aria-labelledby="bloque-que-hago-yo">
    <div class="bloque-cab"><h2 class="bloque-tit" id="bloque-que-hago-yo">Qué hago yo</h2>
    </div>
    <div class="dos-col">
      <div>
        <div class="col-tit">COLUMNA IZQUIERDA</div>
        <ul class="lista">
          <li></li>
          <li></li>
        </ul>
      </div>
      <div>
        <div class="col-tit">COLUMNA DERECHA</div>
        <ul class="lista">
          <li></li>
          <li></li>
        </ul>
      </div>
    </div>
  </section>

  <!-- ===== [TRAMPAS] · .trampas ===== -->
  <!-- cada entrada: <b>el mito</b> seguido de la corrección         -->
  <section class="trampas" aria-labelledby="bloque-trampas">
    <div class="bloque-cab"><h2 class="bloque-tit" id="bloque-trampas">Trampas</h2>
    </div>
    <ul class="lista">
      <li><strong></strong> </li>
      <li><strong></strong> </li>
    </ul>
  </section>

  <!-- ===== pie ===== -->
  <!-- izquierda: campo REFERENCIAS del .txt. Si no viene, va vacío  -->
  <footer class="pie">
    <span></span>
    <span><a href="../index.html">← índice</a> · versión técnica</span>
  </footer>

</main>
</body>
</html>
